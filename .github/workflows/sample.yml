name: sample

on:
  workflow_dispatch:
    inputs:
      nums:
        description: "emotion numbers, space separated"
        default: "41"
        required: true
      voice:
        description: "kokoro voice"
        default: "af_heart"

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt kokoro soundfile
      - name: Render samples
        env:
          MNEMA_VOICE: ${{ github.event.inputs.voice }}
        run: |
          mkdir -p samples
          for n in ${{ github.event.inputs.nums }}; do
            python -m mnemabot.emotion_v2 $n samples/v2-$n-${MNEMA_VOICE}.mp4
          done
      - name: Commit
        run: |
          git config user.name "mnema-bot"
          git config user.email "mnema-bot@users.noreply.github.com"
          git add samples
          git commit -q -m "samples: ${{ github.event.inputs.nums }}" || true
          git pull -q --rebase && git push -q
