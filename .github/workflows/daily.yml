name: daily-post

on:
  schedule:
    # 20:17 UTC ≈ 3–4pm US Eastern → posts land at 19:30 ET the same day.
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry | diag | replace"
        default: "run"
        required: true
      index:
        description: "force calendar slot (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt kokoro soundfile
      - name: Git identity
        run: |
          git config user.name "mnema-bot"
          git config user.email "mnema-bot@users.noreply.github.com"
      - name: Run
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MNEMA_VOICE: am_michael
          MODE: ${{ github.event.inputs.mode || 'run' }}
          INDEX: ${{ github.event.inputs.index }}
        run: |
          ARGS=""
          [ -n "$INDEX" ] && ARGS="--index $INDEX"
          case "$MODE" in
            diag) python -m mnemabot.diag ;;
            replace) python -m mnemabot.replace --index "${INDEX:-0}" ;;
            dry)  python -m mnemabot.run_daily --dry-run $ARGS ;;
            *)    python -m mnemabot.run_daily $ARGS ;;
          esac
